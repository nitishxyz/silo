[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
silo-vt = { path = "crates/silo-vt" }
silo-pty = { path = "crates/silo-pty" }
silo-proto = { path = "crates/silo-proto" }
silo-server = { path = "crates/silo-server" }
silo-client = { path = "crates/silo-client" }
silo-render = { path = "crates/silo-render" }
silo-store = { path = "crates/silo-store" }
silo-transport = { path = "crates/silo-transport" }
iroh = { version = "=1.3.0", features = ["unstable-custom-transports"] }
iroh-mdns-address-lookup = "=0.6.0"
postcard = { version = "1", default-features = false, features = ["use-std"] }
data-encoding = "2"
chacha20poly1305 = "0.10"
gpui = { git = "https://github.com/nitishxyz/zed", rev = "890dcf542c8e3545d9e612abd66f398b4d429a13", default-features = false, features = ["font-kit"] }
gpui_platform = { git = "https://github.com/nitishxyz/zed", rev = "890dcf542c8e3545d9e612abd66f398b4d429a13", default-features = false, features = ["font-kit"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
rustix = { version = "1", features = ["pty", "termios", "process", "fs", "stdio"] }
libc = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
silo-web = { path = "crates/silo-web" }
cef = { version = "=154.5.0", default-features = false }
core-foundation = "0.10"
core-video = { version = "0.5.2", default-features = false, features = ["link"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDate", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.gpui]
opt-level = 3
debug = false

[profile.dev.package.gpui_platform]
opt-level = 3
debug = false
