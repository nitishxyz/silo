[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.18"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
silo-vt = { path = "crates/silo-vt" }
silo-pty = { path = "crates/silo-pty" }
silo-proto = { path = "crates/silo-proto" }
silo-channel = { path = "crates/silo-channel" }
silo-server = { path = "crates/silo-server" }
silo-client = { path = "crates/silo-client" }
silo-tools = { path = "crates/silo-tools" }
silo-render = { path = "crates/silo-render" }
silo-store = { path = "crates/silo-store" }
silo-transport = { path = "crates/silo-transport" }
silo-voice = { path = "crates/silo-voice" }
iroh = { version = "=1.3.0", features = ["unstable-custom-transports"] }
iroh-mdns-address-lookup = "=0.6.0"
postcard = { version = "1", default-features = false, features = ["use-std"] }
data-encoding = "2"
chacha20poly1305 = "0.10"
gpui = { git = "https://github.com/nitishxyz/zed", rev = "2abb9b72143f05324ff65e5935c61325cbd1d520", default-features = false, features = ["font-kit"] }
gpui_platform = { git = "https://github.com/nitishxyz/zed", rev = "2abb9b72143f05324ff65e5935c61325cbd1d520", default-features = false, features = ["font-kit"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# "full": one tokio feature set for every crate, so tokio and everything
# above it is not rebuilt per feature combination.
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
rustix = { version = "1", features = ["pty", "termios", "process", "fs", "stdio"] }
libc = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
silo-web = { path = "crates/silo-web" }
cef = { version = "=154.5.0", default-features = false }
core-foundation = "0.10"
core-video = { version = "0.5.2", default-features = false, features = ["link"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDate", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
# otto
otto-llm = { path = "crates/otto-llm" }
otto-tools = { path = "crates/otto-tools" }
otto-core = { path = "crates/otto-core" }
otto-store = { path = "crates/otto-store" }
otto-proto = { path = "crates/otto-proto" }
otto-server = { path = "crates/otto-server" }
otto-client = { path = "crates/otto-client" }
otto-cli = { path = "crates/otto-cli" }
otto-silo-tools = { path = "crates/otto-silo-tools" }
otto-mcp = { path = "crates/otto-mcp" }
async-trait = "0.1"
futures = "0.3"
bytes = "1"
thiserror = "2"
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
base64 = "0.22"
sha2 = "0.10"
url = "2"
tempfile = "3"
# Syntax highlighting (silo-app/src/syntax): the versions in Zed's workspace
# where it uses crates.io; javascript and toml are not in Zed's set.
tree-sitter = "0.26.9"
streaming-iterator = "0.1.9"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.23"
tree-sitter-diff = "0.1.0"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
# Zed's fork: fixes a buffer overflow in the block scanner's serialize().
tree-sitter-md = { git = "https://github.com/zed-industries/tree-sitter-markdown", rev = "b596e737286780d7bfa9fcddceaeeb754574b352" }
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7"

# Line tables keep file:line backtraces; full debug info made each test
# binary link slowly and left gigabytes of objects in target/debug/deps.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# The browser's hot path (input, frames, the engine's pump) runs every frame;
# small and rarely edited, so optimizing it costs dev rebuilds almost nothing.
[profile.dev.package.silo-web]
opt-level = 2

[profile.dev.package.gpui]
opt-level = 3
debug = false

[profile.dev.package.gpui_platform]
opt-level = 3
debug = false
