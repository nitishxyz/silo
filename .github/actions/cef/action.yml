name: CEF
description: >
  Restores or downloads the pinned CEF distribution (scripts/fetch-cef.sh)
  and exports CEF_PATH.

runs:
  using: composite
  steps:
    - id: cef
      shell: bash
      run: echo "version=$(sed -n 's/^CEF_VERSION="\(.*\)"/\1/p' scripts/fetch-cef.sh)" >> "$GITHUB_OUTPUT"
    # Holds the CEF distribution and the export-cef-dir tool.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/silo-dev
        key: cef-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}-${{ hashFiles('scripts/fetch-cef.sh') }}
    - shell: bash
      run: echo "CEF_PATH=$(scripts/fetch-cef.sh)" >> "$GITHUB_ENV"
