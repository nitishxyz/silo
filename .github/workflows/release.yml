name: release

# Builds Silo for Linux (x86_64, aarch64) and macOS (arm64) and publishes the
# GitHub Release for a `v*` tag:
#   silo-linux-x86_64.tar.gz     `silo` CLI/server
#   silo-linux-aarch64.tar.gz
#   silo-macos-aarch64.tar.gz
#   Silo-<version>.dmg           the app; Developer ID signed, notarized and
#                                stapled (app and DMG)
#   build-id                     silo_proto::BUILD, identical on every platform
#   SHA256SUMS                   covers every other asset (site/install.sh
#                                verifies downloads against it)
#
# The macOS `silo` binary is Developer ID signed and notarized too (a bare
# binary cannot be stapled; Gatekeeper looks its ticket up online). Signing
# is mandatory: the macOS build fails without the APPLE_* secrets.
# Notarization takes two submissions: one zip holding `silo` and Silo.app
# (the notary service tickets every signed item in it, so both are covered),
# then the DMG built around the stapled app.
#
# A tag push builds right away, while the `ci` workflow is still testing the
# same commit (pushed to a branch; ci does not run on tags). The release job
# publishes only once a `ci` push run for that commit has succeeded
# (.github/scripts/wait-for-ci.sh, up to 45 minutes): if ci fails, is
# cancelled (a later push to the branch cancels it), never ran or does not
# finish in time, no release is created. Re-run ci, then re-run this
# workflow's failed jobs; the builds are kept. So push the commit, then the
# tag (or both at once), without waiting for ci.
#
# workflow_dispatch builds the selected ref (or an existing tag) and uploads
# the assets as the `release` artifact; with dry_run unchecked and a tag
# given it publishes that tag's release (behind the same ci gate), replacing
# existing assets. A dry run skips the gate. A tag build takes its sources
# from the tag but the release tooling (scripts/bundle-macos.sh,
# .github/scripts/notarize.sh, .github/scripts/wait-for-ci.sh) from this
# workflow's commit.
#
# Linux builds run on ubuntu-22.04 runners, so the binaries need glibc 2.35
# or newer (Debian 12, Ubuntu 22.04, RHEL/Rocky 10, Fedora 36+). The
# required version is printed in the job summary.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (empty = the selected ref)
        required: false
        default: ""
      dry_run:
        description: Build and upload artifacts only; create no release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: linux, arch: x86_64, runner: ubuntu-22.04, jobs: 2 }
          - { os: linux, arch: aarch64, runner: ubuntu-22.04-arm, jobs: 2 }
          - { os: macos, arch: aarch64, runner: macos-15, jobs: 3 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      ASSET: silo-${{ matrix.os }}-${{ matrix.arch }}
      # rustc peaks at several GB per job on the larger crates (iroh, ghostty
      # bindings); this stays inside the runners' memory.
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Restores the cache release-cache.yml keeps warm on main. A tag never
      # saves one: no later tag could restore it (caches are per ref), and
      # each would take ~3 GB of the repository's 10 GB cache budget.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.os }}-${{ matrix.arch }}
          save-if: ${{ github.ref_type != 'tag' }}
      - name: Use this workflow's signing tooling
        if: matrix.os == 'macos' && inputs.tag != ''
        run: |
          git fetch --no-tags --depth 1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD -- scripts/bundle-macos.sh .github/scripts/notarize.sh
      - uses: ./.github/actions/ghostty
      - if: matrix.os == 'macos'
        uses: ./.github/actions/cef
      - name: Import signing certificate
        if: matrix.os == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SILO_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -eu
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID SILO_SIGN_IDENTITY; do
            [ -n "${!name}" ] || { echo "$name is not set (repository secrets)" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          cert="$RUNNER_TEMP/signing.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -qF "\"$SILO_SIGN_IDENTITY\"" || {
            echo "the certificate holds no valid identity named by APPLE_SIGNING_IDENTITY" >&2
            exit 1
          }
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Build silo
        if: matrix.os == 'linux'
        run: cargo build -p silo-cli --release --locked
      # Builds silo, silo-menubar, otto-silo, the CEF helper and the app into
      # target/Silo.app (Developer ID signed, hardened runtime).
      - name: Build Silo.app
        if: matrix.os == 'macos'
        env:
          SILO_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: scripts/bundle-macos.sh
      # Notarized together with the app below.
      - name: Sign silo
        if: matrix.os == 'macos'
        env:
          SILO_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -eu
          bin=target/release/silo
          codesign --force --sign "$SILO_SIGN_IDENTITY" --options runtime --timestamp "$bin"
          codesign --verify --strict "$bin"
      - name: Package silo
        run: |
          set -eu
          bin=target/release/silo
          "$bin" --version
          # silo-proto's build script output holds SILO_BUILD_ID. The cache
          # can keep stale silo-proto build dirs with other ids, so keep the
          # one id this binary embeds.
          id=$(
            for out in target/release/build/silo-proto-*/output; do
              candidate=$(sed -n 's/^cargo:rustc-env=SILO_BUILD_ID=//p' "$out")
              if [ -n "$candidate" ] && grep -aq "$candidate" "$bin"; then echo "$candidate"; fi
            done | sort -u
          )
          case $id in
            *[!0-9a-f]* | "") echo "cannot determine the build id of $bin: '$id'" >&2; exit 1 ;;
          esac
          [ "${#id}" -eq 16 ] || { echo "bad build id '$id'" >&2; exit 1; }
          mkdir -p stage dist
          cp "$bin" stage/silo
          COPYFILE_DISABLE=1 tar -C stage -czf "dist/$ASSET.tar.gz" silo
          printf '%s\n' "$id" > "dist/build-id-$ASSET"
          {
            echo "### $ASSET"
            echo "- \`$("$bin" --version)\`, build id \`$id\`"
            echo "- $ASSET.tar.gz: $(du -h "dist/$ASSET.tar.gz" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Package Silo.app
        if: matrix.os == 'macos'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SILO_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          dmg="dist/Silo-$version.dmg"
          # Stapling and assessing look the ticket up online; right after
          # notarization the connection can drop or the ticket not be found yet.
          retry() {
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then return; fi
              [ "$attempt" -lt 6 ] || return 1
              sleep $((attempt * 15))
            done
          }
          stapler() { retry xcrun stapler "$@"; }
          staple() { stapler staple "$1"; }
          # One submission tickets the bare `silo` (signed above, already in
          # the tarball) and the app. Staple the app itself so it passes
          # Gatekeeper offline once copied out of the DMG.
          notary=$(mktemp -d)/silo-notary
          mkdir "$notary"
          ditto target/Silo.app "$notary/Silo.app"
          cp target/release/silo "$notary/silo"
          ditto -c -k --keepParent "$notary" "$RUNNER_TEMP/silo-notary.zip"
          .github/scripts/notarize.sh "$RUNNER_TEMP/silo-notary.zip"
          staple target/Silo.app
          notarized() { spctl -a -vv -t install "$1" 2>&1 | tee /dev/stderr | grep '^source=Notarized Developer ID$' > /dev/null; }
          retry notarized target/release/silo
          stage=$(mktemp -d)
          ditto target/Silo.app "$stage/Silo.app"
          ln -s /Applications "$stage/Applications"
          # hdiutil occasionally fails with "Resource busy" on hosted runners.
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname Silo -srcfolder "$stage" -fs HFS+ -format UDZO -ov "$dmg"; then break; fi
            [ "$attempt" -lt 5 ] || exit 1
            sleep $((attempt * 5))
          done
          codesign --force --sign "$SILO_SIGN_IDENTITY" --timestamp "$dmg"
          hdiutil verify "$dmg"
          .github/scripts/notarize.sh "$dmg"
          staple "$dmg"
          stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          codesign --verify --deep --strict "$mnt/Silo.app"
          stapler validate "$mnt/Silo.app"
          spctl -a -vv "$mnt/Silo.app"
          cmp "$mnt/Silo.app/Contents/MacOS/silo-server" target/Silo.app/Contents/MacOS/silo-server
          hdiutil detach "$mnt"
          echo "- $(basename "$dmg"): $(du -h "$dmg" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete signing keychain
        if: always() && matrix.os == 'macos'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - name: Report glibc requirement
        if: matrix.os == 'linux'
        run: |
          set -eu
          glibc=$(objdump -T target/release/silo | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n 1)
          echo "requires $glibc"
          echo "- requires \`$glibc\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Check baseline CPU
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-user > /dev/null
          .github/scripts/check-baseline-cpu.sh target/release/silo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.tag != '') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: silo-*
          merge-multiple: true
      - name: Check build ids agree
        run: |
          set -eu
          cd dist
          ids=$(cat build-id-* | sort -u)
          if [ "$(printf '%s\n' "$ids" | wc -l)" -ne 1 ]; then
            echo "platforms disagree on the build id:" >&2
            grep . build-id-* >&2
            exit 1
          fi
          printf '%s\n' "$ids" > build-id
          rm build-id-*
      - name: Check assets
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$PUBLISH" = true ] && [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match the workspace version $version" >&2
            exit 1
          fi
          cd dist
          for asset in silo-linux-x86_64.tar.gz silo-linux-aarch64.tar.gz silo-macos-aarch64.tar.gz "Silo-$version.dmg" build-id; do
            [ -s "$asset" ] || { echo "missing $asset" >&2; exit 1; }
          done
          [ "$(find . -type f | wc -l)" -eq 5 ] || { echo "unexpected assets:" >&2; ls -l >&2; exit 1; }
          sha256sum -- * > SHA256SUMS
          ls -l
          cat SHA256SUMS
          {
            echo "### Assets"
            echo '```'
            ls -l
            echo
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test install.sh
        run: |
          sh .github/scripts/test-install.sh
          sh .github/scripts/test-install.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/*
          if-no-files-found: error
          compression-level: 0
      # Publish only what ci passed (see the header). The gate script comes
      # from this workflow's commit, like the signing tooling.
      - name: Wait for ci
        if: env.PUBLISH == 'true'
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          script=.github/scripts/wait-for-ci.sh
          if [ "$GITHUB_SHA" != "$sha" ]; then
            git fetch --no-tags --depth 1 origin "$GITHUB_SHA"
            git show "FETCH_HEAD:$script" > "$RUNNER_TEMP/wait-for-ci.sh"
            script=$RUNNER_TEMP/wait-for-ci.sh
          fi
          sh "$script" "$sha" 2700
      - name: Publish
        if: env.PUBLISH == 'true'
        run: |
          set -eu
          cd dist
          # Created as a draft and published once every asset is up, so
          # `releases/latest` (the app's and `silo update`'s check) never
          # names a release missing some.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber
          else
            prerelease=
            case "$TAG" in *-*) prerelease=--prerelease ;; esac
            gh release create "$TAG" --draft --verify-tag --title "Silo ${TAG#v}" --generate-notes $prerelease
            gh release upload "$TAG" ./*
            gh release edit "$TAG" --draft=false
          fi
