name: ci

on:
  push:
    branches: ["**"]
    # Docs and the site (pages.yml checks it) cannot break the build. A
    # release tag needs a ci run on its commit (release.yml), so tag code
    # commits.
    paths-ignore: ["docs/**", "site/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "site/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  linux:
    name: linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # rustc peaks at several GB per job on the larger crates (iroh, ghostty
      # bindings); two jobs stay well inside the 16 GB runner.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # ~/.cargo registry/git and target/ dependency artifacts. Declared
      # before the other caches so its post step (which prunes target/) runs
      # after theirs.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-linux
          cache-on-failure: true
      - uses: ./.github/actions/ghostty
      - name: Build silo
        run: cargo build --locked -p silo-cli
      - name: Test
        run: >
          cargo test --locked
          -p silo-vt -p silo-pty -p silo-store -p silo-proto -p silo-server
          -p silo-client -p silo-transport -p silo-cli -p silo-latency
      # A build host with AVX-512 must not leak it into the binary (SIGILL
      # on older CPUs): libghostty-vt has no AVX code, and silo plus the VT
      # tests run on an emulated Haswell.
      - name: Check baseline CPU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-user > /dev/null
          .github/scripts/check-baseline-cpu.sh target/debug/silo
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="qemu-x86_64 -cpu Haswell" cargo test --locked -p silo-vt

  macos:
    name: macos (arm64)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-macos
          cache-on-failure: true
      - uses: ./.github/actions/ghostty
      - uses: ./.github/actions/cef
      # The whole workspace, app included, compiles here. Tests build first
      # so a failure later still saves a complete Rust cache.
      - name: Build tests
        run: cargo test --locked --workspace --no-run
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
