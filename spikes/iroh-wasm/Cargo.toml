[package]
name = "silo-iroh-wasm-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not part of the silo workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same pin as the silo workspace; browsers need default features off
# (no portmapper/metrics/fast-apple-datapath) but a crypto provider.
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
n0-future = "0.3"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Performance", "Window"] }
console_error_panic_hook = "0.1"

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
