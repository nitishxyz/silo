[package]
name = "silo-server"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false
rust-version.workspace = true

[dependencies]
silo-vt.workspace = true
silo-pty.workspace = true
silo-proto.workspace = true
silo-store.workspace = true
silo-transport.workspace = true
# Silo's own tools, run for raw `tools.call` clients as the caller.
silo-client.workspace = true
silo-tools.workspace = true
# The config VM (`init.lua`, docs/LUA.md §8).
silo-lua.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
rand.workspace = true
libc.workspace = true
rustix.workspace = true
futures.workspace = true
sha2 = "0.10"
data-encoding.workspace = true
# Files blocks: `.gitignore`-aware walks and folder watches.
ignore = "0.4"
notify = "8"
# Search (docs/FINDER.md §2): fff's file picker, frecency (LMDB) and grep.
# Its plain Rust build: `ripgrep` globs, not `zlob` (which needs Zig).
fff-search = { version = "0.11", default-features = false, features = ["ripgrep"] }
# Studio blocks: `studio.toml` edited keeping comments and unknown keys;
# image sizes from their headers.
toml_edit = "0.25"
imagesize = "0.14"
# The type of fff's git statuses (the same libgit2 build fff uses).
git2 = { version = "0.21", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { workspace = true, features = ["NSData", "NSError", "NSFileManager", "NSURL"] }
objc2-app-kit = { workspace = true, features = ["NSPasteboard"] }

[dev-dependencies]

# One binary for the files in tests/it.rs (one link instead of one
# per file); files needing a process of their own stay separate.
[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "sigterm"
path = "tests/sigterm.rs"

[[test]]
name = "views"
path = "tests/views.rs"

[[test]]
name = "agent_api"
path = "tests/agent_api.rs"

[[test]]
name = "access"
path = "tests/access.rs"

[[test]]
name = "agent"
path = "tests/agent.rs"

[[test]]
name = "approval"
path = "tests/approval.rs"

[[test]]
name = "app_requests"
path = "tests/app_requests.rs"

[[test]]
name = "lanes"
path = "tests/lanes.rs"

[[test]]
name = "tools"
path = "tests/tools.rs"

# Sets the process-wide hello token while connecting.
[[test]]
name = "scripting"
path = "tests/scripting.rs"

# The login server's side (docs/LOGIN_SERVER.md §6).
[[test]]
name = "login"
path = "tests/login.rs"
