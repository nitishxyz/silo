[package]
name = "silo-server"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true

[dependencies]
silo-vt.workspace = true
silo-pty.workspace = true
silo-proto.workspace = true
silo-store.workspace = true
silo-transport.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
rand.workspace = true
libc.workspace = true
rustix.workspace = true
futures.workspace = true
sha2 = "0.10"
data-encoding.workspace = true
# Files blocks: `.gitignore`-aware walks and folder watches.
ignore = "0.4"
notify = "8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { workspace = true, features = ["NSData", "NSError", "NSFileManager", "NSURL"] }
objc2-app-kit = { workspace = true, features = ["NSPasteboard"] }

[dev-dependencies]
silo-client.workspace = true

# One binary for the files in tests/it.rs (one link instead of one
# per file); files needing a process of their own stay separate.
[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "sigterm"
path = "tests/sigterm.rs"

[[test]]
name = "agent_api"
path = "tests/agent_api.rs"

[[test]]
name = "access"
path = "tests/access.rs"

[[test]]
name = "agent"
path = "tests/agent.rs"

[[test]]
name = "approval"
path = "tests/approval.rs"

[[test]]
name = "app_requests"
path = "tests/app_requests.rs"
