[package]
name = "silo-cli"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true

[[bin]]
name = "silo"
path = "src/main.rs"

[lib]
name = "silo_cli"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
qrcode = { version = "0.14", default-features = false }
silo-proto.workspace = true
silo-server.workspace = true
silo-client.workspace = true
silo-tools.workspace = true
tokio-util.workspace = true
toml_edit = "0.25"
silo-vt.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true
rustix.workspace = true
libc.workspace = true
clap = { version = "4", features = ["derive"] }

# One binary for the files in tests/it.rs (one link instead of one
# per file); files needing a process of their own stay separate.
[[test]]
name = "it"
path = "tests/it.rs"
