[package]
name = "otto-cli"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "otto-silo"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
clap = { version = "4", features = ["derive"] }
futures.workspace = true
otto-llm.workspace = true
otto-proto.workspace = true
otto-tools.workspace = true
otto-core.workspace = true
otto-client.workspace = true
otto-server.workspace = true
otto-store.workspace = true
otto-silo-tools.workspace = true
otto-mcp.workspace = true
uuid.workspace = true
serde.workspace = true
rustix.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true

# One binary for the files in tests/it.rs (one link instead of one
# per file); files needing a process of their own stay separate.
[[test]]
name = "it"
path = "tests/it.rs"
