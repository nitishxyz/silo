[package]
name = "otto-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# `otto_mcp::fake`: an in-process HTTP MCP and OAuth server for tests.
fake = ["dep:sha2", "dep:base64"]

[dependencies]
otto-tools.workspace = true
otto-llm.workspace = true
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
async-trait.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
otto-core.workspace = true
otto-proto.workspace = true
otto-mcp = { path = ".", features = ["fake"] }
otto-store.workspace = true

# Line-delimited stdio MCP server used by this crate's tests.
[[bin]]
name = "otto-mcp-fixture"
path = "src/bin/fixture.rs"
test = false
doc = false
