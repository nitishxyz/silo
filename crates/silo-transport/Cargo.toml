[package]
name = "silo-transport"
version.workspace = true
edition.workspace = true
autotests = false
# iroh 1.3 requires rustc 1.91.
rust-version = "1.91"
license.workspace = true

[dependencies]
silo-store.workspace = true
iroh.workspace = true
iroh-mdns-address-lookup.workspace = true
postcard.workspace = true
data-encoding.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

# One binary for the files in tests/it.rs (one link instead of one
# per file); files needing a process of their own stay separate.
[[test]]
name = "it"
path = "tests/it.rs"
