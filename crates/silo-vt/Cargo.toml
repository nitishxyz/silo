[package]
name = "silo-vt"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true
links = "ghostty-vt"

[build-dependencies]
cc = "1"

# Only sys.rs may perform unsafe operations. C ABI layouts belong to the shim.
[lints.rust]
unsafe_code = "deny"

# One binary for the files in tests/it.rs (one link instead of one
# per file); files needing a process of their own stay separate.
[[test]]
name = "it"
path = "tests/it.rs"
