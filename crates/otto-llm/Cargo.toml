[package]
name = "otto-llm"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true
license.workspace = true

[features]
default = ["client"]
# Provider clients and the `Model` trait. Without it only the transcript,
# request, event and model-info types build (wasm-safe, for otto-proto).
client = ["dep:async-trait", "dep:futures", "dep:bytes", "dep:tokio", "dep:tokio-util", "dep:tracing", "dep:reqwest", "dep:rand", "dep:sha2", "dep:base64", "dep:libc", "dep:httpdate", "dep:chrono", "dep:tokio-websockets", "dep:tokio-rustls", "dep:rustls", "dep:rustls-platform-verifier"]

[dependencies]
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
httpdate = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
# OpenAI Responses WebSocket mode. All four are already in the lockfile (iroh, reqwest).
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "ring", "rand", "rustls-bring-your-own-connector"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "server", "ring", "rand"] }

# One binary for the files in tests/it.rs (one link instead of one
# per file); files needing a process of their own stay separate.
[[test]]
name = "it"
path = "tests/it.rs"
