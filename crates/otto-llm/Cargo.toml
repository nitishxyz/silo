[package]
name = "otto-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["client"]
# Provider clients and the `Model` trait. Without it only the transcript,
# request, event and model-info types build (wasm-safe, for otto-proto).
client = ["dep:async-trait", "dep:futures", "dep:bytes", "dep:tokio", "dep:tokio-util", "dep:tracing", "dep:reqwest", "dep:rand", "dep:sha2", "dep:base64", "dep:libc", "dep:httpdate", "dep:chrono"]

[dependencies]
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
httpdate = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
