[package]
name = "otto-proto"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true
license.workspace = true

[features]
default = []
io = ["dep:tokio"]

[dependencies]
# The build channel and Silo's home rules (std, serde and schemars only).
silo-channel.workspace = true
otto-llm = { workspace = true, default-features = false }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# Deliberately do not inherit the workspace's native networking features.
tokio = { version = "1", default-features = false, features = ["io-util", "rt", "sync", "macros"], optional = true }

# One binary for the files in tests/it.rs (one link instead of one
# per file); files needing a process of their own stay separate.
[[test]]
name = "it"
path = "tests/it.rs"
