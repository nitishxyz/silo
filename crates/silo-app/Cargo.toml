[package]
name = "silo-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "silo-app"
path = "src/main.rs"

[dependencies]
silo-client.workspace = true
silo-proto.workspace = true
silo-vt.workspace = true
silo-render.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
serde.workspace = true
data-encoding.workspace = true
otto-client.workspace = true
otto-proto.workspace = true
otto-llm = { workspace = true, default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
idna = "1"
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "tiff", "jpeg", "gif", "webp"] }
unicode-width = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tree-sitter.workspace = true
streaming-iterator.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-css.workspace = true
tree-sitter-diff.workspace = true
tree-sitter-go.workspace = true
tree-sitter-html.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-json.workspace = true
tree-sitter-md.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-toml-ng.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-yaml.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { workspace = true, features = ["NSArray", "NSBundle", "NSDictionary", "NSError", "NSGeometry", "NSURL", "NSValue"] }
# The permission helper (`permissions.rs`): its drag tile, window chrome,
# System Settings and screens.
objc2-app-kit = { workspace = true, features = ["NSControl", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSImage", "NSImageView", "NSPasteboard", "NSScreen", "NSView", "NSWindow", "NSWorkspace"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }
silo-web.workspace = true
raw-window-handle = "0.6"
# Interface sounds (`sound.rs`): a low-latency output stream mixing
# synthesized voices, opened on the first sound and released when idle.
cpal = "0.16"

[features]
# Compile Metal shaders at runtime: works with only the Command Line Tools.
# Build with `--no-default-features` when the Xcode Metal toolchain exists.
default = ["runtime_shaders"]
runtime_shaders = ["gpui_platform/runtime_shaders"]

[dev-dependencies]
silo-server.workspace = true
gpui = { workspace = true, features = ["test-support"] }
