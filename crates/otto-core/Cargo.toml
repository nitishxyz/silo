[package]
name = "otto-core"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true
license.workspace = true

[dependencies]
otto-llm = { workspace = true, features = ["client"] }
otto-tools.workspace = true
otto-store.workspace = true
otto-proto.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
futures.workspace = true
serde_json.workspace = true
jsonschema = { version = "0.59", default-features = false }
tracing.workspace = true
thiserror.workspace = true
async-trait.workspace = true
uuid = { workspace = true, features = ["v4"] }
regex = "1"

[dev-dependencies]
tempfile.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
otto-silo-tools.workspace = true

# One binary for the files in tests/it.rs (one link instead of one
# per file); files needing a process of their own stay separate.
[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "snapshots_no_git"
path = "tests/snapshots_no_git.rs"
