[package]
name = "silo-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "On-device voice typing for Silo: capture, trigger, visualizer bands and speech engines"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
silo-proto.workspace = true
rustfft = "6.4"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.16"
objc2.workspace = true
objc2-foundation.workspace = true
block2 = "0.6"
# The multilingual engine: whisper.cpp (MIT) through whisper-rs (Unlicense), on Metal.
whisper-rs = { version = "0.16", features = ["metal", "tracing_backend"] }

[build-dependencies]
sha2.workspace = true
